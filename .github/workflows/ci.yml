name: CI

# Compile et teste Plume à chaque push sur main, feature/** et fix/**, et sur
# chaque pull request. Les exécutables Windows sont téléchargeables dans
# l'onglet « Actions » (section « Artifacts » de chaque exécution). Un tag v*
# publie une Release, que la mise à jour automatique de Plume sait récupérer.
# Les modifications de documentation seule ne relancent pas la compilation.

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Modèle de test (tiny) en cache
        uses: actions/cache@v6
        with:
          path: ci-modeles
          key: whisper-ggml-tiny-v1
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Télécharger le modèle de test
        run: |
          mkdir -p ci-modeles
          if [ ! -f ci-modeles/ggml-tiny.bin ]; then
            curl -fsSL --retry 3 -o ci-modeles/ggml-tiny.bin \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          fi
      - name: Tests (dont le test de bout en bout en français)
        env:
          PLUME_TEST_MODELE: ${{ github.workspace }}/ci-modeles/ggml-tiny.bin
        run: cargo test --release

  windows:
    name: Windows (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: carte-graphique
            features: vulkan
            asset: plume-windows-x64.exe
          - variant: processeur
            features: moteur
            asset: plume-windows-x64-cpu.exe
    env:
      # Dossier de compilation court : les shaders Vulkan dépassent sinon la
      # limite de 260 caractères des chemins Windows.
      CARGO_TARGET_DIR: C:\t
      # Exécutable autonome : pas besoin d'installer le runtime Visual C++.
      RUSTFLAGS: -C target-feature=+crt-static
      CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
      # Pas d'optimisation pour le processeur du serveur de compilation (il
      # peut avoir AVX-512, absent de beaucoup de PC) : base AVX2, valable
      # pour tous les processeurs depuis 2013.
      GGML_NATIVE: "OFF"
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}
          cache-targets: "false"
      - name: Vulkan SDK
        if: matrix.features == 'vulkan'
        shell: pwsh
        run: |
          $v = "1.4.313.2"
          $exe = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          curl.exe -fsSL --retry 3 -o $exe "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
          & $exe --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "installation du Vulkan SDK : code $LASTEXITCODE" }
          "VULKAN_SDK=C:\VulkanSDK\$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\$v\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Compiler
        run: cargo build --release --no-default-features --features ${{ matrix.features }}
      - name: Modèle de test (tiny) en cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/plume-ci/modeles
          key: whisper-ggml-tiny-win-v1
      - name: Tests unitaires
        run: cargo test --release --no-default-features --features ${{ matrix.features }} --lib --bins
      - name: Essai réel de plume.exe (téléchargement + transcription en français)
        shell: pwsh
        env:
          PLUME_DOSSIER: ${{ runner.temp }}\plume-ci
        run: |
          # plume.exe est un programme « fenêtré » : PowerShell ne l'attend pas
          # tout seul, d'où Start-Process -Wait avec sorties dans des fichiers.
          $exe = Join-Path $env:CARGO_TARGET_DIR "release\plume.exe"
          function Invoke-Plume([string[]]$PlumeArgs) {
            $out = Join-Path $env:RUNNER_TEMP "plume-out.txt"
            $err = Join-Path $env:RUNNER_TEMP "plume-err.txt"
            $p = Start-Process -FilePath $exe -ArgumentList $PlumeArgs -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $out -RedirectStandardError $err
            $o = Get-Content $out -Raw -Encoding utf8
            $e = Get-Content $err -Raw -Encoding utf8
            if ($e) { Write-Host $e }
            if ($p.ExitCode -ne 0) { throw "plume $($PlumeArgs -join ' ') : code $($p.ExitCode)" }
            return "$o"
          }
          Write-Host (Invoke-Plume @("--version"))
          Invoke-Plume @("--telecharger-modele", "tiny") | Out-Null
          $text = Invoke-Plume @("--transcrire", "tests\data\librivox-fr-12s.wav", "--modele", "tiny", "--precision", "1")
          Write-Host "Texte : $text"
          if ($text -notmatch "chapitre") { throw "transcription inattendue" }
      - name: Préparer l'exécutable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR "release\plume.exe") "dist\${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publier la version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.exe \
            --repo "${{ github.repository }}" \
            --title "Plume ${{ github.ref_name }}" \
            --notes "Télécharge plume-windows-x64.exe (carte graphique) ou plume-windows-x64-cpu.exe (processeur seul)."
