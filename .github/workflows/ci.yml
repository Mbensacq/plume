name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.6
      - run: ruff check .

  test:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cible réelle du projet : installation CPU sur Windows, sur la version
          # minimale et la version maximale de Python prises en charge.
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
          # Linux : cœur + tests d'interface sous Xvfb (pas de capture audio).
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      PLUME_DEVICE: cpu
      PLUME_MODEL: tiny
      PLUME_MODEL_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install (CPU path, exactly as documented)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      - name: Cache Whisper "tiny" model
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-tiny-${{ runner.os }}-v1

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest

      - name: Unit tests (Linux, GUI under Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb python3-tk
          xvfb-run -a -s "-screen 0 1024x768x24" python -m pytest

      - name: Self-test (loads the model, CPU inference, no GUI)
        run: python plume.py --selftest

      - name: Version flag
        run: python plume.py --version

  build:
    # Prouve à chaque push que la version portable se construit et démarre :
    # même recette que release.yml, sans publication (artefact conservé 7 jours).
    name: Portable build (Windows x64, CPU)
    needs: test
    runs-on: windows-latest
    env:
      PLUME_DEVICE: cpu
      PLUME_MODEL: tiny
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m PyInstaller Plume.spec --noconfirm --clean
      - name: Smoke test the frozen executable
        shell: pwsh
        run: |
          .\dist\Plume\Plume-console.exe --version
          .\dist\Plume\Plume-console.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
          Remove-Item -Recurse -Force dist\Plume\models -ErrorAction SilentlyContinue
          Copy-Item plume_replacements.json, LICENSE dist\Plume\
          Copy-Item docs\LISEZMOI-portable.txt dist\Plume\LISEZMOI.txt
          Get-ChildItem dist\Plume -Recurse | Measure-Object -Property Length -Sum |
            ForEach-Object { "Bundle size: {0:N0} MB" -f ($_.Sum / 1MB) }
      - uses: actions/upload-artifact@v4
        with:
          name: Plume-portable-windows-x64-cpu
          path: dist/Plume
          retention-days: 7
