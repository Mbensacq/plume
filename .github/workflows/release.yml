name: Release (portable Windows build)

# Déclenchement : push d'un tag v* (ex. `git tag v1.0.0 && git push origin v1.0.0`),
# ou lancement manuel (workflow_dispatch) pour tester le build sans publier.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build portable (Windows x64, CPU)
    runs-on: windows-latest
    env:
      PLUME_DEVICE: cpu
      PLUME_MODEL: tiny
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU) and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest

      - name: Build with PyInstaller
        run: python -m PyInstaller Plume.spec --noconfirm --clean

      - name: Add user files to the bundle
        shell: pwsh
        run: |
          Copy-Item plume_replacements.json dist\Plume\
          Copy-Item LICENSE dist\Plume\
          Copy-Item docs\LISEZMOI-portable.txt dist\Plume\LISEZMOI.txt

      - name: Smoke test the frozen executable (loads the model, CPU inference)
        shell: pwsh
        run: |
          .\dist\Plume\Plume-console.exe --version
          .\dist\Plume\Plume-console.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
          # le modèle de test ne doit pas partir dans l'archive
          Remove-Item -Recurse -Force dist\Plume\models -ErrorAction SilentlyContinue

      - name: Compute version and zip
        id: pack
        shell: pwsh
        run: |
          $version = (python -c "import plume; print(plume.__version__)")
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart("v") }
          $zip = "Plume-$version-windows-x64-cpu.zip"
          Compress-Archive -Path dist\Plume -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-Item $zip | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: ${{ steps.pack.outputs.zip }}
          retention-days: 14

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Plume ${{ steps.pack.outputs.version }}
          files: ${{ steps.pack.outputs.zip }}
          generate_release_notes: true
          body: |
            Version portable Windows (x64, CPU) : décompressez l'archive et lancez `Plume.exe`.
            Le modèle Whisper est téléchargé au premier lancement (connexion requise une seule fois).
            Pour l'accélération GPU NVIDIA, installez depuis les sources (voir README).
